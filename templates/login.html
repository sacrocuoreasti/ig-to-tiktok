<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - ReelSync (IG to TikTok)</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-pink-500 selection:text-white">

    <!-- Ambient glow decoration -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-600/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden p-8 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-yellow-500 via-pink-500 to-cyan-400 p-0.5 shadow-lg shadow-pink-500/25">
                <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
                    <i data-lucide="lock" class="w-7 h-7 text-pink-400"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-400 via-rose-300 to-cyan-300 bg-clip-text text-transparent">
                ReelSync Dashboard
            </h1>
            <p class="text-xs text-slate-400">
                Inserisci le credenziali di amministratore per accedere
            </p>
        </div>

        {% if error %}
        <div class="bg-rose-500/15 border border-rose-500/30 rounded-xl p-3 text-xs text-rose-300 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-400"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Nome Utente</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input type="text" id="username" name="username" required autofocus value="{{ username or '' }}"
                           placeholder="admin"
                           class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••"
                           class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-bold bg-gradient-to-r from-pink-500 to-cyan-500 hover:opacity-95 text-slate-950 shadow-lg shadow-pink-500/25 transition transform active:scale-[0.98]">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Accedi al Pannello</span>
                </button>
            </div>
        </form>

        <div class="border-t border-slate-800/80 pt-4 text-center">
            <p class="text-[11px] text-slate-500">
                Credenziali predefinite: <span class="font-mono text-slate-400">admin</span> / <span class="font-mono text-slate-400">admin</span>
            </p>
            <p class="text-[10px] text-slate-600 mt-1">
                Potrai modificare username e password nelle Impostazioni una volta effettuato l'accesso.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
