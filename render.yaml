services:
  - type: web
    name: reelsync-ig-to-tiktok
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 10000
      - key: INSTAGRAM_USERNAME
        value: sacrocuoreasti
      - key: TIKTOK_MODE
        value: zernio
      - key: ZERNIO_API_KEY
        sync: false
      - key: AUTO_DELETE_VIDEO
        value: "true"
